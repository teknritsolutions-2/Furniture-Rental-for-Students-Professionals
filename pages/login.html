<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — Demonstration Portal | MODULIV</title>
  <meta name="description" content="Sign in to the MODULIV customer portal to manage active rentals, view upcoming due dates, initiate swaps, and download agreements.">
  <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">

  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-wrapper">
  <a href="#login-form" class="skip-link">Skip to login form</a>

  <!-- Centered Auth Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <!-- Brand Logo on Top Inside Container -->
      <div class="auth-card-logo" style="display: flex; justify-content: center; align-items: center; margin-bottom: 24px;">
        <a href="../index.html" class="brand-link" aria-label="MODULIV Home">
          <img src="../assets/brand/logo.svg" alt="MODULIV" class="brand-logo logo-light" style="height: 42px;">
          <img src="../assets/brand/logo-white.svg" alt="MODULIV" class="brand-logo logo-dark" style="height: 42px;">
        </a>
      </div>

      <div class="auth-card-header">
        <h1 class="subsection-h3" style="margin-bottom: 6px;">Sign in to your account</h1>
        <p class="body-sm">Welcome back! Please enter your credentials to continue.</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div id="login-error-alert" style="display: none; padding: 10px 14px; background-color: var(--color-danger-bg); border: 1px solid var(--color-danger); color: var(--color-danger); border-radius: var(--radius-sm); font-size: 0.8125rem; margin-bottom: 16px;"></div>

        <div class="form-group" id="group-email">
          <label for="login-email" class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
          <span class="form-error">Please enter a valid email address.</span>
        </div>

        <div class="form-group" id="group-password">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="#" class="auth-forgot-link" onclick="alert('Password reset instructions have been simulated to your registered email.'); return false;">Forgot password?</a>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="btn-toggle-pw" aria-label="Show password" title="Show or hide password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <span class="form-error">Please enter your password.</span>
        </div>

        <div class="auth-remember-row">
          <label class="auth-remember-label">
            <input type="checkbox" id="login-remember" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>

        <div class="auth-divider">or</div>

        <div style="text-align: center; font-size: 0.875rem;">
          <span style="color: var(--color-muted-text);">Don't have an account?</span>
          <a href="register.html" id="link-create-account" style="color: var(--color-forest); font-weight: 600; margin-inline-start: 4px; text-decoration: none;">Create an account</a>
        </div>
      </form>
    </div>
  </main>

  <script src="../assets/data/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const auth = window.NestloopAuth;

      // If already logged in, redirect straight to dashboard
      auth.guardAuthPages();

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const pwInput = document.getElementById('login-password');
      const errBox = document.getElementById('login-error-alert');
      const togglePwBtn = document.getElementById('btn-toggle-pw');
      const registerLink = document.getElementById('link-create-account');

      // Check URL query parameters for notice and redirect
      const urlParams = new URLSearchParams(window.location.search);
      const rawRedirect = urlParams.get('redirect');

      if (rawRedirect && registerLink) {
        registerLink.href = `register.html?redirect=${encodeURIComponent(rawRedirect)}`;
      }

      if (urlParams.get('notice') === 'login_required') {
        errBox.style.display = 'block';
        errBox.textContent = 'Please sign in to access the customer rental portal.';
      }

      // Show / Hide Password toggle
      togglePwBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        togglePwBtn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
      });

      // Sanitize redirect target to strictly avoid open redirects and loops
      function sanitizeRedirect(target) {
        if (!target) return 'dashboard.html';
        const trimmed = String(target).trim();
        // Disallow external URLs or absolute protocols
        if (/^(?:[a-z]+:|\/\/)/i.test(trimmed)) return 'dashboard.html';
        // Prevent loop back to login
        if (trimmed.includes('login.html')) return 'dashboard.html';
        return trimmed;
      }

      // Handle Submission
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errBox.style.display = 'none';

        const email = emailInput.value.trim();
        const pw = pwInput.value.trim();

        if (!email || !pw) {
          errBox.style.display = 'block';
          errBox.textContent = 'Please provide both your email and password.';
          return;
        }

        const res = auth.login(email, pw);
        if (res.success) {
          if (window.NestloopApp && window.NestloopApp.showToast) {
            window.NestloopApp.showToast(`Welcome back, ${res.user.name}!`, 'success');
          }
          const destination = sanitizeRedirect(rawRedirect);
          setTimeout(() => {
            window.location.href = destination;
          }, 300);
        } else {
          errBox.style.display = 'block';
          errBox.textContent = res.error;
        }
      });
    });
  </script>
</body>
</html>
