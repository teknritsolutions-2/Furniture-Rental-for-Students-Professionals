<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account | MODULIV</title>
  <meta name="description" content="Create a customer account on MODULIV to explore furniture packages, rental agreements, and billing schedules.">
  <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">

  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-wrapper">
  <a href="#register-form" class="skip-link">Skip to registration form</a>

  <!-- Centered Register Card -->
  <main class="auth-container">
    <div class="auth-card">
      <!-- Brand Logo on Top Inside Container -->
      <div class="auth-card-logo" style="display: flex; justify-content: center; align-items: center; margin-bottom: 24px;">
        <a href="../index.html" class="brand-link" aria-label="MODULIV Home">
          <img src="../assets/brand/logo.svg" alt="MODULIV Logo" class="brand-logo logo-light" style="height: 42px;">
          <img src="../assets/brand/logo-white.svg" alt="MODULIV Logo" class="brand-logo logo-dark" style="height: 42px;">
        </a>
      </div>

      <div class="auth-card-header">
        <h1 class="subsection-h3" style="margin-bottom: 6px;">Create your account</h1>
        <p class="body-sm">Join MODULIV for flexible student &amp; professional rentals.</p>
      </div>

      <form id="register-form" novalidate>
        <div id="reg-error-alert" style="display: none; padding: 10px 14px; background-color: var(--color-danger-bg); border: 1px solid var(--color-danger); color: var(--color-danger); border-radius: var(--radius-sm); font-size: 0.8125rem; margin-bottom: 16px;"></div>

        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Verma" required>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="two-column-grid" style="gap: 12px;">
          <div class="form-group">
            <label for="reg-role" class="form-label">Profile Type</label>
            <select id="reg-role" class="form-select">
              <option value="Working Professional">Working Professional</option>
              <option value="University Student">University Student</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-city" class="form-label">Current Metro City</label>
            <select id="reg-city" class="form-select">
              <option value="Bengaluru">Bengaluru</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Pune">Pune</option>
              <option value="Chennai">Chennai</option>
              <option value="Mumbai">Mumbai</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
            <button type="button" class="password-toggle-btn" id="btn-toggle-reg-pw" aria-label="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Account
        </button>

        <div class="auth-divider">or</div>

        <div style="text-align: center; font-size: 0.875rem;">
          <span style="color: var(--color-muted-text);">Already have an account?</span>
          <a href="login.html" style="color: var(--color-forest); font-weight: 600; margin-inline-start: 4px; text-decoration: none;">Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="../assets/data/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const auth = window.NestloopAuth;
      auth.guardAuthPages();

      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const roleInput = document.getElementById('reg-role');
      const cityInput = document.getElementById('reg-city');
      const pwInput = document.getElementById('reg-password');
      const errBox = document.getElementById('reg-error-alert');
      const toggleBtn = document.getElementById('btn-toggle-reg-pw');

      toggleBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errBox.style.display = 'none';

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const pw = pwInput.value.trim();
        const role = roleInput.value;
        const city = cityInput.value;

        if (!name || !email || !pw) {
          errBox.style.display = 'block';
          errBox.textContent = 'Please fill in all required fields.';
          return;
        }

        const res = auth.register({ name, email, password: pw, role, city });
        if (res.success) {
          if (window.NestloopApp && window.NestloopApp.showToast) {
            window.NestloopApp.showToast(`Account created for ${res.user.name}!`, 'success');
          }
          const urlParams = new URLSearchParams(window.location.search);
          const rawRedirect = urlParams.get('redirect');
          function sanitizeRedirect(target) {
            if (!target) return 'dashboard.html';
            const trimmed = String(target).trim();
            if (/^(?:[a-z]+:|\/\/)/i.test(trimmed)) return 'dashboard.html';
            if (trimmed.includes('register.html') || trimmed.includes('login.html')) return 'dashboard.html';
            return trimmed;
          }
          const destination = sanitizeRedirect(rawRedirect);
          setTimeout(() => {
            window.location.href = destination;
          }, 300);
        } else {
          errBox.style.display = 'block';
          errBox.textContent = res.error;
        }
      });
    });
  </script>
</body>
</html>
