<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" width="176" height="40" fill="none">
  <!-- MODULIV Architectural Mark (White / Dark Background Theme) -->
  <defs>
    <linearGradient id="logo-white-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <g transform="translate(2, 4)">
    <rect width="32" height="32" rx="8.5" fill="url(#logo-white-grad)" stroke="#334155" stroke-width="1"/>
    <!-- Left Modular Arch -->
    <path d="M8 23V13C8 10.24 10.24 8 13 8C15.76 8 18 10.24 18 13V23" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round"/>
    <!-- Right Overlapping Sky-Blue Modular Arch -->
    <path d="M14 23V13C14 10.24 16.24 8 19 8C21.76 8 24 10.24 24 13V23" stroke="#38BDF8" stroke-width="2.75" stroke-linecap="round"/>
    <!-- Foundation Beam -->
    <path d="M7 23H25" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
    <!-- Central Living Node -->
    <circle cx="16" cy="14" r="1.8" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark: Clean, premium white, NO subtext underneath -->
  <text x="44" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.035em" fill="#FFFFFF">MODU<tspan fill="#38BDF8">LIV</tspan></text>
</svg>
