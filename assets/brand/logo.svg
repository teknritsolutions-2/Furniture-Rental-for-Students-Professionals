<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- MODULIV Brand Mark: Interlocking Modular Living Blocks forming an architectural 'M' -->
  <g transform="translate(4, 6)">
    <rect width="36" height="36" rx="9" fill="#102035"/>
    <!-- Modular Block Left -->
    <rect x="7" y="10" width="8" height="16" rx="3" fill="#DCE5EF"/>
    <!-- Modular Center Connector -->
    <rect x="14" y="16" width="8" height="10" rx="2.5" fill="#457B9D"/>
    <!-- Modular Block Right -->
    <rect x="21" y="10" width="8" height="16" rx="3" fill="#2E5077"/>
    <!-- Living Dot Accent -->
    <circle cx="18" cy="11" r="2.2" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="27" font-family="'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.03em" fill="#102035">MODU<tspan fill="#457B9D">LIV</tspan></text>
  <text x="51" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.14em" fill="#64748B">MODULAR LIVING · ON YOUR TERMS</text>
</svg>
